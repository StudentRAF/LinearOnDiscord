<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="url" content="https://linear-on-discord.vercel.app" />
		<meta
			name="description"
			content="Receive Linear updates directly in your Discord channels."
		/>
		<link rel="canonical" href="https://linear-on-discord.vercel.app" />
		<link rel="stylesheet" href="./styles.css">
		<title>Linear on Discord</title>
	</head>
	<body>
		<h1>Linear on Discord</h1>

		<form id="form" class="form-container">
			<div class="form-item">
				<label for="webhookUrl">
					<span>Discord Webhook URL</span>
				</label>
				<input
					id="webhookUrl"
					type="url"
					placeholder="https://discord.com/api/webhooks/Xv43cjAaw55feEWbv93"
					required
				/>
			</div>

			<div class="form-item">
				<label for="linearToken">
					<span>Linear API Token</span>
				</label>
				<input
					id="linearToken"
					type="text"
					placeholder="lin_api_XvcjAaw55feEWbv93"
					required
				/>
			</div>

			<button
				id="copy"
				type="submit"
				class="form-submit"
			>
				Copy webhook URL
			</button>
		</form>

		<script>
			const API_ENDPOINT_URL = 'https://linear-on-discord.vercel.app/api/webhook';
			const DISCORD_WEBHOOK_EXPRESSION =
				/https:\/\/discord\.com\/api\/webhooks\/([\d]+)\/([\w+.-]+)/i;

			const form = document.getElementById('form');
			const webhookUrlInput = document.getElementById('webhookUrl');
			const linearTokenInput = document.getElementById('linearToken');
			const copy = document.getElementById('copy');

			form.addEventListener('submit', (e) => {
				e.preventDefault();

				const webhookUrl = webhookUrlInput.value;
				const linearToken = linearTokenInput.value;
				const match = webhookUrl.match(DISCORD_WEBHOOK_EXPRESSION);

				if (!match) {
					result.innerText = 'Invalid Webhook URL';

					return;
				}

				const [, webhookId, webhookToken] = match;
				const url = new URL(API_ENDPOINT_URL);

				url.searchParams.set('webhookId', webhookId);
				url.searchParams.set('webhookToken', webhookToken);
				url.searchParams.set('linearToken', linearToken);

				navigator.clipboard.writeText(url.toString());

				copy.innerText = 'Copied to clipboard';

				setTimeout(() => {
					copy.innerText = 'Copy webhook URL';
				}, 2000);
			});
		</script>
	</body>
</html>
